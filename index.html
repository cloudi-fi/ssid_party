<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSID_PARTY — a night at the captive portal</title>
<link rel="icon" href="img/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h2 class="sr-only">A scroll-down comic strip, two panels per row, showing step by step how a device joins a Wi-Fi network, is held captive, talks to the captive-portal API, registers via single sign-on, and finally reaches the internet.</h2>
  <header class="top">
    <h1>SSID_PARTY</h1>
    <p class="tagline">A night at the captive portal.</p>
    <nav class="views" role="tablist" aria-label="View">
      <button type="button" class="viewtab" role="tab" data-view="comic">Comic</button>
      <button type="button" class="viewtab" role="tab" data-view="sequence">Sequence diagram</button>
      <button type="button" class="viewtab" role="tab" data-view="decision">Decision diagram</button>
      <button type="button" class="viewtab" role="tab" data-view="criteria">Criteria</button>
      <span class="tools">
        <button type="button" class="toolbtn critbtn" id="critbtn" aria-pressed="false" hidden>Show criteria</button>
        <button type="button" class="toolbtn widebtn" id="widebtn" aria-pressed="false" hidden>Full width</button>
      </span>
    </nav>
  </header>
  <div class="comic" id="comic"></div>
  <div id="sequence" hidden></div>
  <div id="decision" hidden></div>
  <div id="criteria" hidden></div>
</div>

<!-- classic scripts sharing one global scope: keep this order -->
<script src="js/draw.js"></script>
<script src="js/graph.js"></script>
<script src="js/views.js"></script>
<script src="js/main.js"></script>
</body>
</html>
