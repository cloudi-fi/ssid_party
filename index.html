<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSID_PARTY — a night at the captive portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#ffffff; --surface-2:#f1efe9; --foot-bg:#eaedf0; --ink:#1b1b19; --ink-2:#6a6a64; --line:#d9d8d2;
    --c-dave:#2563eb; --c-troller:#0891b2; --c-ray:#3f4651; --c-dippy:#d97706; --c-fail:#dc2626; --c-phyre:#dc2626;
    --c-chippy:#6d28d9; --c-porter:#16a34a; --c-soso:#c026d3;
    --band-grey:#9aa0a6; --band-green:#22c55e;
    --font-sfx:"Bangers", Impact, sans-serif;
    --font-comic:"Patrick Hand", "Comic Sans MS", cursive;
    --font-sans:"Inter", system-ui, -apple-system, sans-serif;
  }
  :root{color-scheme:light}
  *{box-sizing:border-box}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface);
    padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 40px);
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto}
  h1{font-family:var(--font-sfx);font-weight:400;font-size:46px;line-height:.95;letter-spacing:1px;margin:0 0 4px}
  .tagline{font-family:var(--font-comic);font-size:19px;color:var(--ink-2);margin:0 0 12px}
  .hint{font-size:13px;color:var(--ink-2);margin:0 0 14px}
  .cast{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 20px;padding:12px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .cast span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
  .cast i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
  .cast b{font-weight:500}
  .cast em{color:var(--ink-2);font-style:normal}
  .comic{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media (max-width:580px){ .comic{grid-template-columns:1fr} h1{font-size:38px} }
  .panel{margin:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);
    display:flex;flex-direction:column}
  .cap{display:flex;align-items:baseline;gap:8px;padding:8px 11px;border-bottom:2px solid var(--ink);background:var(--surface)}
  .pnum{font-family:var(--font-sfx);font-size:19px;color:var(--ink-2);flex:none;line-height:1}
  .narr{font-family:var(--font-comic);font-size:16px;color:var(--ink);flex:1;line-height:1.25}
  .loc{font-size:11px;color:var(--ink-2);flex:none;text-transform:lowercase;white-space:nowrap}
  .panel svg{display:block;width:100%;height:auto}
  .foot{display:flex;flex:1 0 auto;flex-direction:column;gap:6px;align-items:flex-start;padding:10px 11px;border-top:1.5px solid var(--ink);background:var(--foot-bg)}
  .tag{flex:none;font-size:11px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);
    border-radius:6px;padding:3px 7px;white-space:nowrap}
  .note{font-size:12px;color:var(--ink-2);line-height:1.35}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none} }

  .views{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 18px}
  .viewtab{font-family:var(--font-sans);font-size:14px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
  .viewtab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .linkbtn{font:inherit;color:var(--c-dave);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .resetbtn{margin-left:auto;font-size:13px}
  button:focus-visible{outline:2px solid var(--c-dave);outline-offset:2px}
  .whatif{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 11px;border-top:1.5px dashed var(--ink-2);background:var(--surface)}
  g.chip{cursor:pointer} g.chip:focus-visible rect{stroke:var(--c-dave);stroke-width:2.5} g.chip:focus{outline:none}
  .decinner{min-width:760px;padding:6px 0}
  .wq{font-family:var(--font-comic);font-size:16px;color:var(--ink);margin-right:2px}
  .wopt{font-family:var(--font-comic);font-size:15px;line-height:1.15;color:var(--ink);background:var(--surface);border:1.5px dashed var(--ink-2);border-radius:14px;padding:4px 10px;cursor:pointer;text-align:left}
  .wopt:hover{border-color:var(--ink)}
  .wopt[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--surface)}
  .altb{flex:none;font-size:11px;font-weight:500;color:var(--surface);background:var(--ink);border-radius:6px;padding:1px 6px}
  .endcard{grid-column:1/-1;font-family:var(--font-comic);font-size:18px;padding:14px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--surface)}
  .endcard .linkbtn{font-family:var(--font-comic);font-size:18px}
  .endcard.endwarn{border-color:var(--c-fail)}
  .seqscroll{overflow-x:auto;border:2px solid var(--ink);border-radius:10px;background:var(--surface)}
  .seqinner{min-width:876px}
  body.wide .seqinner,body.wide .seqheadin{min-width:0}
  .seqhead{position:sticky;top:0;z-index:2;overflow:hidden;background:var(--surface);border:2px solid var(--ink);border-bottom-width:1.5px;border-radius:10px 10px 0 0;padding:4px 0}
  .seqbody{border-top:0;border-radius:0 0 10px 10px}
  .seqhead svg,.seqstep svg{display:block}
  .seqstep{border-bottom:1px solid var(--line)}
  .seqlabel{display:flex;gap:8px;align-items:baseline;padding:8px 12px 0;flex-wrap:wrap}
  .seqlabel .narr{font-family:var(--font-comic);font-size:16px}
  .whatif.inseq{border-top:1.5px dashed var(--ink-2);position:sticky;left:0;max-width:760px}
  .tintro{font-size:14px;color:var(--ink-2);margin:0 0 12px}
  .tree{border-left:2px solid var(--ink);margin-left:10px;padding-left:16px}
  .trow{display:flex;gap:8px;align-items:center;padding:5px 0;flex-wrap:wrap}
  .tnum{font-family:var(--font-sfx);font-size:17px;color:var(--ink-2);min-width:20px}
  .tdots{display:inline-flex;gap:3px}.tdots i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .tnarr{font-family:var(--font-comic);font-size:16px}
  .tbranch{margin:6px 0 10px 18px;padding:10px 12px;border:1.5px dashed var(--ink-2);border-radius:12px;background:var(--surface)}
  .thead{margin-bottom:4px}.thead b{font-family:var(--font-comic);font-size:16px;font-weight:400;text-decoration:underline}
  .tsame{font-size:12.5px;color:var(--ink-2);padding:3px 0 3px 28px}
  .tend{font-family:var(--font-comic);font-size:15px;color:var(--c-fail);padding:4px 0 2px 28px}
  .tend.ok{color:var(--c-porter)}
  .trunkend{padding-left:0}
  .readbtn{margin:8px 0 0 28px;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
  .readbtn:hover{background:var(--ink);color:var(--surface)}
  .widebtn{margin-left:auto;font-family:var(--font-sans);font-size:13px;color:var(--ink);background:var(--surface);border:1.5px dashed var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer}
  .widebtn[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--surface)}
  body.wide .wrap{max-width:none}
  .wsel{position:relative;display:inline-flex;max-width:100%}
  .wselect{appearance:none;-webkit-appearance:none;max-width:100%;font-family:var(--font-comic);font-size:16px;line-height:1.2;color:var(--ink);background:var(--surface);border:1.5px dashed var(--ink);border-radius:14px;padding:4px 30px 4px 11px;cursor:pointer;text-overflow:ellipsis}
  .wselect:hover{border-style:solid}
  .wselect:focus-visible{outline:2px solid var(--c-dave);outline-offset:2px}
  .wsel::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-52%);pointer-events:none;color:var(--ink);font-size:14px}
  .wsel{min-width:0}
  .whatif .wq{flex:none}
  .nsel{position:relative}
  .ntxt{border-bottom:1.5px dashed var(--ink);cursor:pointer}
  .caret{font-family:var(--font-sans);font-size:12px;margin-left:6px;color:var(--ink-2)}
  .tsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;-webkit-appearance:none;border:0;padding:0}
  .nsel:hover .ntxt{border-bottom-style:solid}
  .nsel:focus-within .ntxt{outline:2px solid var(--c-dave);outline-offset:3px;border-radius:2px}
  .yaml{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;width:100%;box-sizing:border-box;white-space:pre;overflow:auto;tab-size:2}
  textarea.yaml{resize:vertical;min-height:180px}
  .yaml.ro{border-style:dashed;border-width:1.5px;margin:0}
  .yaml.inline{display:inline;padding:2px 6px;border-width:1px;border-radius:6px;font-size:12px;white-space:normal;word-break:break-all}
  .critbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 18px}
  .critbar .readbtn{margin:0}
  .critstatus{font-size:13px;color:var(--c-porter)}
  .critstatus.err{color:var(--c-fail)}
  .crith{font-family:var(--font-comic);font-weight:400;font-size:18px;margin:0 0 8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h2 class="sr-only">A scroll-down comic strip, two panels per row, showing step by step how a device joins a Wi-Fi network, is held captive, talks to the captive-portal API, registers via single sign-on, and finally reaches the internet.</h2>
  <h1>SSID_PARTY</h1>
  <p class="tagline">A night at the captive portal.</p>
  <nav class="views" role="tablist" aria-label="View">
    <button type="button" class="viewtab" role="tab" data-view="comic">Comic</button>
    <button type="button" class="viewtab" role="tab" data-view="sequence">Sequence diagram</button>
    <button type="button" class="viewtab" role="tab" data-view="decision">Decision diagram</button>
    <button type="button" class="viewtab" role="tab" data-view="criteria">Criteria</button>
    <button type="button" class="widebtn" id="widebtn" aria-pressed="false" hidden>Full width</button>
  </nav>
  <div class="comic" id="comic"></div>
  <div id="sequence" hidden></div>
  <div id="decision" hidden></div>
  <div id="criteria" hidden></div>
</div>

<script>
const CH={
  dave:{name:"Dave Ice",color:"var(--c-dave)",acc:"phone"},
  troller:{name:"Conn Troller",color:"var(--c-troller)",acc:"antenna"},
  ray:{name:"Ray Dius",color:"var(--c-ray)",acc:"shades"},
  dippy:{name:"Dee Ashcipee",color:"var(--c-dippy)",acc:"ticket"},
  chippy:{name:"Cee Peahy",color:"var(--c-chippy)",acc:"screen"},
  porter:{name:"Port Al",color:"var(--c-porter)",acc:"bowtie"},
  soso:{name:"Heidi Pea",color:"var(--c-soso)",acc:"badge"},
  phyre:{name:"Phyre Wall",color:"var(--c-phyre)",acc:"flame"}
};
const CY=174, W=440, FLOOR=256;

function acc(type,cx,cy){
  const C='stroke="currentColor"', F='fill="currentColor"', S='fill="var(--surface)"';
  switch(type){
    case "phone": return `<rect x="${cx-28}" y="${cy+30}" width="12" height="20" rx="3.5" ${S} ${C} stroke-width="1.5"/><rect x="${cx-25.5}" y="${cy+33}" width="7" height="13" rx="1" ${F} opacity="0.6"/>`;
    case "flame": { const fx=cx+21, fy=cy+38; return `<path d="M${fx} ${fy-22} C${fx+9} ${fy-11} ${fx+8} ${fy} ${fx} ${fy} C${fx-8} ${fy} ${fx-9} ${fy-11} ${fx} ${fy-22} Z" ${F}/><path d="M${fx} ${fy-12} C${fx+4} ${fy-6} ${fx+4} ${fy-1} ${fx} ${fy-1} C${fx-4} ${fy-1} ${fx-4} ${fy-6} ${fx} ${fy-12} Z" fill="#fbbf24"/>`; }
    case "bowtie": return `<path d="M${cx-8} ${cy+18} L${cx} ${cy+22} L${cx-8} ${cy+26} Z M${cx+8} ${cy+18} L${cx} ${cy+22} L${cx+8} ${cy+26} Z" ${F}/>`;
    case "antenna": return `<line x1="${cx-6}" y1="${cy-14}" x2="${cx-10}" y2="${cy-27}" ${C} stroke-width="2" stroke-linecap="round"/><circle cx="${cx-10}" cy="${cy-28}" r="2.4" ${F}/><line x1="${cx+6}" y1="${cy-14}" x2="${cx+10}" y2="${cy-27}" ${C} stroke-width="2" stroke-linecap="round"/><circle cx="${cx+10}" cy="${cy-28}" r="2.4" ${F}/>`;
    case "shades": return `<rect x="${cx-10}" y="${cy-5}" width="9" height="5.5" rx="1.5" fill="var(--ink)"/><rect x="${cx+1}" y="${cy-5}" width="9" height="5.5" rx="1.5" fill="var(--ink)"/><line x1="${cx-1}" y1="${cy-3}" x2="${cx+1}" y2="${cy-3}" stroke="var(--ink)" stroke-width="1.5"/>`;
    case "ticket": return `<g transform="translate(${cx+13},${cy+34})"><rect width="20" height="12" rx="1.5" ${S} ${C} stroke-width="1.5"/><circle cx="0" cy="6" r="2" ${S} ${C} stroke-width="1"/><circle cx="20" cy="6" r="2" ${S} ${C} stroke-width="1"/><line x1="10" y1="2" x2="10" y2="10" ${C} stroke-width="1" stroke-dasharray="1.5 1.5"/></g>`;
    case "screen": return `<rect x="${cx-29}" y="${cy+30}" width="19" height="16" rx="2" ${S} ${C} stroke-width="1.5"/><circle cx="${cx-19.5}" cy="${cy+35}" r="1.3" ${F}/><line x1="${cx-23}" y1="${cy+40}" x2="${cx-16}" y2="${cy+40}" ${C} stroke-width="1.3"/>`;
    case "bell": return `<path d="M${cx+11} ${cy+45} a8 8 0 0 1 16 0 Z" ${S} ${C} stroke-width="1.5"/><rect x="${cx+10}" y="${cy+45}" width="18" height="3" rx="1" ${F}/><circle cx="${cx+19}" cy="${cy+35}" r="1.7" ${F}/>`;
    case "badge": return `<path d="M${cx-29} ${cy+31} l9 -3 l9 3 v6 q0 7.5 -9 11.5 q-9 -4 -9 -11.5 Z" ${S} ${C} stroke-width="1.5"/><path d="M${cx-24} ${cy+39} l3 3 l6 -7" fill="none" ${C} stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    default: return "";
  }
}

function figure(key,cx,{band=null,mood="smile",flip=false,headSpin=false,phone=null,antennas=false,cloudHead=false,zombie=false}={}){
  const c=CH[key], cy=CY;
  let mouth;
  if(mood==="smile") mouth=`<path d="M${cx-4} ${cy+5} q4 3.5 8 0" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>`;
  else if(mood==="open") mouth=`<ellipse cx="${cx}" cy="${cy+6}" rx="2.6" ry="3.2" fill="var(--ink)"/>`;
  else mouth=`<line x1="${cx-4}" y1="${cy+6}" x2="${cx+4}" y2="${cy+6}" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>`;
  if(zombie){
    const Z='stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 3"';
    return `<g style="color:${c.color}">
    <line x1="${cx}" y1="${cy+16}" x2="${cx}" y2="${cy+54}" ${Z}/><line x1="${cx}" y1="${cy+26}" x2="${cx-16}" y2="${cy+42}" ${Z}/><line x1="${cx}" y1="${cy+26}" x2="${cx+16}" y2="${cy+42}" ${Z}/><line x1="${cx}" y1="${cy+54}" x2="${cx-12}" y2="${cy+82}" ${Z}/><line x1="${cx}" y1="${cy+54}" x2="${cx+12}" y2="${cy+82}" ${Z}/>
    <circle cx="${cx}" cy="${cy}" r="16" fill="var(--surface)" stroke="currentColor" stroke-width="2.4"/><ellipse cx="${cx-5.5}" cy="${cy-2}" rx="3.2" ry="3.8" fill="var(--ink)"/><ellipse cx="${cx+5.5}" cy="${cy-2}" rx="3.2" ry="3.8" fill="var(--ink)"/><path d="M${cx-6} ${cy+7} l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
    ${key==="dave"?(phone==="iot"?"":`<rect x="${cx-28}" y="${cy+30}" width="12" height="20" rx="3.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>`):""}
    <text x="${cx}" y="${FLOOR+14}" text-anchor="middle" font-family="var(--font-sans)" font-weight="500" font-size="12" fill="var(--ink-2)">${c.name}</text></g>`;
  }
  const eyes = c.acc==="shades" ? "" :
    `<circle cx="${cx-5}" cy="${cy-2}" r="1.7" fill="var(--ink)"/><circle cx="${cx+5}" cy="${cy-2}" r="1.7" fill="var(--ink)"/>`;
  const bandEl = band ?
    `<rect x="${cx+14.5}" y="${cy+37}" width="8" height="4.5" rx="2" style="fill:var(${band})" stroke="rgba(0,0,0,.18)" stroke-width="0.5"/>` : "";
  let accStr = flip ? "" : acc(c.acc,cx,cy);
  if(antennas) accStr+=acc("antenna",cx,cy);
  if(key==="dave" && phone==="none") accStr="";
  else if(key==="dave" && phone==="iot") accStr=`<rect x="${cx-32}" y="${cy+32}" width="18" height="12" rx="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><rect x="${cx-27}" y="${cy+29}" width="7" height="3" rx="1" fill="currentColor"/><circle cx="${cx-23}" cy="${cy+38}" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="${cx-23}" cy="${cy+38}" r="1.4" fill="currentColor"/>`;
  else if(key==="dave" && phone==="android") accStr=`<rect x="${cx-28}" y="${cy+30}" width="12" height="20" rx="3.5" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><rect x="${cx-25.5}" y="${cy+33}" width="7" height="13" rx="1" fill="#3ddc84"/>`;
  return `<g style="color:${c.color}">
    <line x1="${cx}" y1="${cy+16}" x2="${cx}" y2="${cy+54}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy+26}" x2="${cx-18}" y2="${cy+40}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy+26}" x2="${cx+18}" y2="${cy+40}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy+54}" x2="${cx-14}" y2="${cy+82}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy+54}" x2="${cx+14}" y2="${cy+82}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    ${cloudHead
      ? `<path d="M${cx-20} ${cy+14} a8 8 0 0 1 1 -15 a11 11 0 0 1 20 -9 a10 10 0 0 1 16 9 a8 8 0 0 1 2 15 Z" fill="var(--surface)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>`
      : headSpin
      ? `<circle cx="${cx}" cy="${cy}" r="16" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><g class="spinner"><circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="26 74" stroke-linecap="round"/></g>`
      : `<circle cx="${cx}" cy="${cy}" r="16" fill="var(--surface)" stroke="currentColor" stroke-width="2.4"/>`}
    ${eyes}${mouth}${accStr}${bandEl}
    <text x="${cx}" y="${FLOOR+14}" text-anchor="middle" font-family="var(--font-sans)" font-weight="500" font-size="12" fill="var(--ink-2)">${c.name}</text>
  </g>`;
}

const NB_NAMES=["Port Al","Phyre Wall","Dave Ice","Conn Troller","Ray Dius","Dee Ashcipee","Cee Peahy","Heidi Pea"];
const FULL=t=>String(t).replace(/\b(Dave|Conn|Ray|Dee|Cee|Heidi|Phyre)\b(?![\u00a0 ](?:Ice|Troller|Dius|Ashcipee|Peahy|Pea|Wall)\b)/g,m=>({Dave:"Dave Ice",Conn:"Conn Troller",Ray:"Ray Dius",Dee:"Dee Ashcipee",Cee:"Cee Peahy",Heidi:"Heidi Pea",Phyre:"Phyre Wall"})[m]);
const NB=t=>NB_NAMES.reduce((acc,n)=>acc.split(n).join(n.replace(/ /g,"\u00a0")),String(t));
function wrap(t,max){
  const words=t.split(" "); const lines=[]; let cur="";
  for(const w of words){ if((cur+" "+w).trim().length>max){ if(cur)lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }
  if(cur)lines.push(cur); return lines;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function bubble(cx,text,{kind="speech",align="center",top=false,color="var(--c-troller)"}={}){
  const shout=kind==="shout";
  const font = shout?"var(--font-sfx)":"var(--font-comic)";
  const fs = shout?17:14.5;
  const charW = shout?8.6:7.2;
  const maxc = shout?15:18;
  const lines=wrap(NB(text),maxc);
  const padX=11, padY=9, lh=shout?18:19;

function nextOf(id,s){
  const nx=N[id].next; if(!nx) return null;
  if(typeof nx==="string") return nx;
  if(nx.k){ const ok=optsFor(nx.k,s); let v=s[nx.k]; if(ok.length && !ok.some(o=>o.v===v)) v=ok.some(o=>o.v===DEF[nx.k])?DEF[nx.k]:(ok.find(o=>o.fb)||ok[0]).v; if(!ok.length) v=DEF[nx.k]; return nx.map[v]; }
  for(const c of nx.cases) if(!c.when||c.when(s)) return c.to;
  return null;
}

let STATE={...DEF}, VIEW="comic";
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  STATE={...DEF};
  for(const k in CHOICES){ const v=h.get(k); if(v && CHOICES[k].opts.some(o=>o.v===v)) STATE[k]=v; }
  normalize(STATE);
  let v=h.get("view"); if(v==="branches") v="decision";
  VIEW=["comic","sequence","decision","criteria"].includes(v)?v:"comic";
}
function writeHash(){
  const h=new URLSearchParams();
  if(VIEW!=="comic") h.set("view",VIEW);
  for(const k in CHOICES) if(STATE[k]!==DEF[k]) h.set(k,STATE[k]);
  const s=h.toString();
  try{ history.replaceState(null,"",s?"#"+s:location.pathname+location.search); }catch(e){}
}

function panelSVG(id,st){

  s+=bg(V(p.bg,st));
  const actors=V(p.a,st);
  for(const a of actors){
    if(a.k==="ray"&&a.seated){ s+=rayDesk(a.x); continue; }
    const band=a.band || (a.k==="dave"&&st.radius==="mab"&&rayCheckers(st)?"--band-green":null);
    const phone=a.k==="dave" ? (a.nophone?"none":st.os) : null;
    s+=figure(a.k,a.x,{band,mood:a.mood||"smile",headSpin:a.headSpin||false,phone,antennas:a.k==="phyre"&&st.integ==="fwBoth",cloudHead:a.k==="phyre"&&cloud(st),zombie:!!a.zombie});
  }
  for(const a of actors){ const b=V(a.b,st); if(b) s+=bubble(a.x,b,{kind:a.kind||"speech",align:a.al||"center",top:a.top||false,color:CH[a.k].color}); }

    const ok=optsFor(k,st); if(ok.length && !ok.some(o=>o.v===st[k])) st[k]=ok.some(o=>o.v===DEF[k])?DEF[k]:(ok.find(o=>o.fb)||ok[0]).v;

function titleSel(key){

  }

  return `<span class="narr nsel"><span class="ntxt">${esc(NB(FULL(V(cur.title,STATE))))}<span class="caret" aria-hidden="true">▾</span></span><select class="wselect tsel" id="wi-${key}" data-k="${key}" aria-label="Change this step (${esc(c.tq)})">${body}</select></span>`;
}

  } else {
    const x1=LX(fi), x2=LX(ti), d=x2>x1?1:-1, xe=x2-d*2;
    s+=`<line x1="${x1}" y1="${y}" x2="${xe-d*7}" y2="${y}" stroke="${col}" stroke-width="1.8" ${m.r?'stroke-dasharray="5 4"':""}/><polygon points="${xe},${y} ${xe-d*9},${y-5} ${xe-d*9},${y+5}" fill="${col}"/>`;
    let tx=(x1+x2)/2-lw/2; tx=Math.max(4,Math.min(tx,SW-lw-4));
    s+=`<rect x="${tx}" y="${y-19}" width="${lw}" height="15" rx="3" fill="var(--surface)"/><text x="${tx+6}" y="${y-8}" font-family="var(--font-sans)" font-size="11" fill="var(--ink)">${esc(m.l)}</text>`;
  }
  return s+`<circle cx="${LX(fi)}" cy="${y}" r="3" fill="${col}"/>`;
}
function renderSeq(){
  const wide=document.body.classList.contains("wide"), host=document.getElementById("sequence");
  const avail=wide&&host&&host.clientWidth?host.clientWidth-4:0;
  LGAP=Math.max(108,Math.floor((avail-120)/(LANES.length-1))||108); SW=120+(LANES.length-1)*LGAP;
  const ids=path(STATE), rowH=34;
  let y=14, body="";
  for(const id of ids){
    const p=N[id], seq=V(p.seq,STATE);
    if(hasChoice(id,STATE)){
      const c=CHOICES[p.choice], top=y; y+=8;
      let hx=58, chips="", line=0;
      const lab=`[${c.tq}]`;
      chips+=`<text x="${hx}" y="${y+13}" font-family="var(--font-sans)" font-size="11" font-weight="500" fill="var(--ink)">${esc(lab)}</text>`;
      hx+=lab.length*6.4+10;
      for(const o of optsFor(p.choice,STATE)){ let ch=chipSVG(hx,y,o.t,p.choice,o.v); if(hx+ch.w>SW-16){ y+=24; hx=58; ch=chipSVG(hx,y,o.t,p.choice,o.v);} chips+=ch.svg; hx+=ch.w+6; }
      y+=26;
      let msgs=""; for(const m of seq){ y+=rowH-8; msgs+=msgSVG(m,y); y+=8; }
      y+=12;
      body+=`<rect x="10" y="${top}" width="${SW-20}" height="${y-top}" rx="4" fill="none" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="6 4"/>`;
      body+=`<path d="M10 ${top} h40 v14 l-6 6 h-34 Z" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.2"/><text x="16" y="${top+15}" font-family="var(--font-sans)" font-size="11" font-weight="500" fill="var(--ink)">alt</text>`;
      body+=chips+msgs; y+=10;
    } else {
      for(const m of seq){ y+=rowH-8; body+=msgSVG(m,y); y+=8; }
    }
  }
  y+=18;
  if(ids.includes("nHack")&&N[ids[ids.length-1]].ok){ const x=LX(0); body+=`<text x="${x-8}" y="${y+4}" font-family="var(--font-sans)" font-size="11" font-weight="500" fill="var(--c-fail)">Internet access · identity never verified (DHCP blacklist bypassed)</text>`; y+=20; }
  if(N[ids[ids.length-1]].end){ const x=LX(0); body+=`<line x1="${x-12}" y1="${y-8}" x2="${x+12}" y2="${y+8}" stroke="var(--c-fail)" stroke-width="2.4"/><line x1="${x+12}" y1="${y-8}" x2="${x-12}" y2="${y+8}" stroke="var(--c-fail)" stroke-width="2.4"/><text x="${x+20}" y="${y+4}" font-family="var(--font-sans)" font-size="11" fill="var(--c-fail)">no Internet access</text>`; y+=20; }
  const H=y+10;
  let lines=""; LANES.forEach((k,i)=>{ lines+=`<line x1="${LX(i)}" y1="0" x2="${LX(i)}" y2="${H}" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="4 4"/>`; });
  let head=`<svg viewBox="0 0 ${SW} 40" width="${SW}" height="40" aria-hidden="true">`;
  LANES.forEach((k,i)=>{ const x=LX(i); head+=`<rect x="${x-48}" y="5" width="96" height="30" rx="6" fill="var(--surface)" stroke="${CH[k].color}" stroke-width="2"/><text x="${x}" y="24" text-anchor="middle" font-family="var(--font-sans)" font-weight="500" font-size="12" fill="var(--ink)">${TECH[k]}</text>`; });
  head+=`</svg>`;
  document.getElementById("sequence").innerHTML=`<div class="seqhead"><div class="seqheadin" style="min-width:${SW}px">${head}</div></div><div class="seqscroll seqbody"><div class="seqinner" style="min-width:${SW}px">
    <svg viewBox="0 0 ${SW} ${H}" width="${SW}" height="${H}" role="img" aria-label="Sequence diagram">${lines}${body}</svg></div></div>`;
  const sb=document.querySelector("#sequence .seqbody"), sh=document.querySelector("#sequence .seqhead");
  if(sb&&sh){ sb.addEventListener("scroll",()=>{ sh.scrollLeft=sb.scrollLeft; }); sh.scrollLeft=sb.scrollLeft; }
}

/* ---------- decision diagram (auto layout) ---------- */
const DCW=196, DBW=172, DROW=118, DPAD=16;
function graphEdges(){
  const E=[];
  for(const id in N){
    const nx=N[id].next; if(!nx) continue;
    if(typeof nx==="string") E.push({f:id,t:nx});
    else if(nx.k){
      const opts=[...CHOICES[nx.k].opts].sort((a,b)=>(b.v===DEF[nx.k])-(a.v===DEF[nx.k]));
      for(const o of opts) if(nx.map[o.v]) E.push({f:id,t:nx.map[o.v],l:o.t,set:{[nx.k]:o.v}});
    } else for(const c of nx.cases) E.push({f:id,t:c.to,l:c.l,set:c.set});
  }
  return E;
}
let LAYOUT=null;
function layout(){
  if(LAYOUT) return LAYOUT;
  const E=graphEdges(), out={}, inc={};
  for(const id in N){ out[id]=[]; inc[id]=0; }
  E.forEach(e=>{ out[e.f].push(e); inc[e.t]++; });
  const order=[], seen={};
  (function topo(u){ if(seen[u]) return; seen[u]=1; out[u].forEach(e=>topo(e.t)); order.unshift(u); })("n1");
  const row={n1:0}; order.forEach(u=>out[u].forEach(e=>{ row[e.t]=Math.max(row[e.t]??0,(row[u]??0)+1); }));
  const col={}; let nextCol=0;
  (function place(u,c){ if(u in col) return; col[u]=c; out[u].forEach((e,i)=>place(e.t, i===0?c:++nextCol)); })("n1",0);
  const chains={};
  for(const u in col){ const c=col[u]; (chains[c]=chains[c]||{c,ids:[],min:1e9,max:-1}); chains[c].ids.push(u); chains[c].min=Math.min(chains[c].min,row[u]); chains[c].max=Math.max(chains[c].max,row[u]); }
  const headOf={}; Object.values(chains).forEach(ch=>{ headOf[ch.c]=ch.ids.reduce((a,b)=>row[a]<=row[b]?a:b); });
  const parentOf={}; E.forEach(e=>{ const c=col[e.t]; if(col[e.f]!==c && e.t===headOf[c] && !(c in parentOf)) parentOf[c]=col[e.f]; });
  const occ={}, phys={};
  Object.values(chains).sort((a,b)=>a.c-b.c).forEach(ch=>{
    const want=(ch.c in parentOf && phys[parentOf[ch.c]]!=null)?phys[parentOf[ch.c]]:0;
    const free=k=>!(occ[k]||[]).some(([a,b])=>ch.min<=b+1 && ch.max>=a-1);
    let best=null; for(let d=0;best===null;d++){ for(const k of [want+d,want-d]) if(k>=0 && free(k)){ best=k; break; } }
    phys[ch.c]=best; (occ[best]=occ[best]||[]).push([ch.min,ch.max]);
  });
  const minC=Math.min(...Object.values(phys)); for(const c in phys) phys[c]-=minC;
  for(const u in col) col[u]=phys[col[u]];
  const ncol=Math.max(...Object.values(col))+1, nrow=Math.max(...Object.values(row))+1;
  const box={};
  for(const id in col){
    const x=DPAD+DCW/2+col[id]*DCW, top=20+row[id]*DROW;
    if(N[id].dec) box[id]={x,top,h:44,bot:top+44,dia:1};
    else { const lines=wrap(N[id].tag,26), h=lines.length*14+14; box[id]={x,top,h,bot:top+h,lines}; }
  }
  return LAYOUT={E,box,row,col,ncol,nrow,W:DPAD*2+ncol*DCW,H:40+nrow*DROW};
}
function renderDecision(){
  const L=layout(), fp=fullPath(STATE), onN=new Set(fp), onE=new Set();
  for(let i=0;i<fp.length-1;i++) onE.add(fp[i]+">"+fp[i+1]);
  let e="", n="", chips="";
  const placed=[];
  const occupied=(c,r1,r2)=>Object.keys(L.col).some(id=>L.col[id]===c&&L.row[id]>r1&&L.row[id]<r2);
  L.E.forEach(ed=>{
    const a=L.box[ed.f], b=L.box[ed.t], act=onE.has(ed.f+">"+ed.t);
    const ra=L.row[ed.f], rb=L.row[ed.t], rowTop=20+ra*DROW, el=b.top-18, gx=b.x-DCW/2;
    const straightOK=!occupied(L.col[ed.t],ra,rb);
    let d, chipX=b.x;
    if(N[ed.f].dec){
      const bus=rowTop+62;
      if(rb===ra+1 || (a.x!==b.x && straightOK)) d=`M${a.x} ${a.bot} V${bus} H${b.x} V${b.top-7}`;
      else if(a.x===b.x && straightOK) d=`M${a.x} ${a.bot} V${b.top-7}`;
      else { d=`M${a.x} ${a.bot} V${bus} H${gx} V${el} H${b.x} V${b.top-7}`; chipX=gx; }
    } else if(a.x===b.x && !occupied(L.col[ed.f],ra,rb)) d=`M${a.x} ${a.bot} V${b.top-7}`;
    else if(rb===ra+1) d=`M${a.x} ${a.bot} V${el} H${b.x} V${b.top-7}`;
    else d=`M${a.x} ${a.bot} V${rowTop+90} H${gx} V${el} H${b.x} V${b.top-7}`;
    const st=act?'stroke="var(--ink)" stroke-width="2.2"':'stroke="var(--ink-2)" stroke-width="1.1" opacity="0.4"';
    e+=`<path d="${d}" fill="none" ${st}/><polygon points="${b.x},${b.top} ${b.x-5},${b.top-7} ${b.x+5},${b.top-7}" fill="${act?"var(--ink)":"var(--ink-2)"}" ${act?"":'opacity="0.4"'}/>`;
    if(ed.l){
      const w=ed.l.length*6+18, pressed=act;
      let cy=rowTop+67;
      const hit=y=>placed.some(r=>chipX-w/2<r.x+r.w && r.x<chipX+w/2 && y<r.y+16 && r.y<y+16);
      for(let k=0;k<3 && hit(cy);k++) cy+=19;
      placed.push({x:chipX-w/2,y:cy,w});
      chips+=`<g class="wopt chip" data-set='${JSON.stringify(ed.set)}' role="button" tabindex="0" aria-pressed="${pressed}">
        <rect x="${chipX-w/2}" y="${cy}" width="${w}" height="16" rx="8" fill="${pressed?"var(--ink)":"var(--surface)"}" stroke="${pressed?"var(--ink)":"var(--ink-2)"}" stroke-width="1.1" ${pressed?"":'stroke-dasharray="3 2"'}/>
        <text x="${chipX}" y="${cy+12}" text-anchor="middle" font-family="var(--font-sans)" font-size="10.5" fill="${pressed?"var(--surface)":"var(--ink)"}">${esc(ed.l)}</text></g>`;
    }
  });
  for(const id in L.box){
    const b=L.box[id], act=onN.has(id), op=act?"":'opacity="0.4"';
    if(b.dia){
      const cy=b.top+22;
      n+=`<g ${op}><polygon points="${b.x},${b.top} ${b.x+82},${cy} ${b.x},${b.bot} ${b.x-82},${cy}" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="${act?1.8:1.2}"/>
        <text x="${b.x}" y="${cy+4}" text-anchor="middle" font-family="var(--font-sans)" font-weight="500" font-size="11" fill="var(--ink)">${esc(N[id].dec)}</text></g>`;
    } else {
      const endN=N[id].end, ok=N[id].ok, stroke=endN?"var(--c-fail)":ok?"var(--c-porter)":"var(--ink)";
      n+=`<g ${op}><rect x="${b.x-DBW/2}" y="${b.top}" width="${DBW}" height="${b.h}" rx="6" fill="var(--surface)" stroke="${stroke}" stroke-width="${act||endN||ok?2:1.2}"/>`+
        b.lines.map((l,j)=>`<text x="${b.x}" y="${b.top+18+j*14}" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--ink)">${esc(l)}</text>`).join("")+`</g>`;
    }
  }
  document.getElementById("decision").innerHTML=`<p class="tintro">Start at the top left. Scroll sideways to explore every branch; the bold path is the current configuration. Click a label under a diamond to switch branch.</p><div class="seqscroll"><div class="decinner" style="min-width:${L.W}px">
    <svg viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" height="${L.H}" role="img" aria-label="Decision diagram">${e}${n}${chips}</svg></div></div>`;
}

/* ---------- criteria (flat YAML) ---------- */
const CRIT=[
  {name:"device_os",key:"os"},
  {name:"controller_vendor",key:"vendor"},
  {name:"enforcement",key:"integ"},
  {name:"fw_vendor",key:"fwvendor"},
  {name:"transient",key:"transient"},
  {name:"mab",key:"radius"},
  {name:"dhcp",key:"dhcp"},
  {name:"static_ip_bypass",key:"hack"},
  {name:"dhcp_snooping",key:"snooping"},
  {name:"visit",key:"visit"},
  {name:"option_114",key:"o114"},
  {name:"cna_done",key:"done"},
  {name:"registration",key:"reg"},
  {name:"sms_notification",key:"smsexit"}
];
const CRIT_BY_NAME=Object.fromEntries(CRIT.map(c=>[c.name,c]));
function derived(s){
  const p=path(s), last=p[p.length-1], L=N[last];
  const runsIn=p.includes("n15")?"browser":p.includes("n15n")?"mini-browser":"none";
  const risk=runsIn==="mini-browser"&&s.os==="ios"&&["mfa","sms","email"].includes(s.reg);
  const fa=p.includes("n18")?"radius (controller login)":p.includes("n18L")?"radius (firewall login)":p.includes("n18api")?"controller-api + radius":p.includes("n18g")?"signed-return-url":p.includes("n18c")?`saml (${s.fwvendor==="zscaler"?"idp-initiated":"sp-initiated"})`:p.includes("n19m")||p.includes("n19m2")?"mab (portal bypassed)":"none";
  const outcome=L.ok?(p.includes("nHack")&&p.includes("n19w")?"internet_bypass":"internet"):({n5r:"access_denied",nNoIp:"no_lease",n12d2:"https_blackhole",nMfaEnd:"mfa_lost",nPasskeyEnd:"passkey_unavailable",nIot:"no_captive_detection",nBlack:"blacklisted_silent_drop",nSnoopYes:"static_ip_dropped",nStale:"stale_captive_state"})[last]||"blocked";
  const dhcpHosting=["quarantine","whitelist","blacklist","zombies"].includes(s.dhcp)?"cloud":"on-prem";
  return {dhcp_hosting:dhcpHosting,portal_runs_in:runsIn,app_switch_risk:risk?"yes":"no",final_auth:p.includes("n19w")?(p.includes("nHack")?"none (static IP bypass)":"dhcp-whitelist (portal bypassed)"):fa,outcome,steps:p};
}
function criteriaText(s){
  const lines=["# SSID_PARTY — flat criteria. One line per criterion: key: value","# Values are the words used in the diagrams. Lines starting with # are ignored.",""];
  for(const c of CRIT){
    const all=CHOICES[c.key].opts, ok=optsFor(c.key,s);
    const vals=all.map(o=>o.v).join(" | ");
    let note="", shown=String(s[c.key]);
    if(ok.length===0){ shown="none"; note="  (not applicable here)"; } else if(ok.length<all.length) note=`  (here: ${ok.map(o=>o.v).join(" | ")})`;
    lines.push(`${(c.name+":").padEnd(19)}${shown.padEnd(18)}# ${vals}${note}`);
  }
  return lines.join("\n");
}
function parseCriteria(text){
  const out={}, errors=[], notes=[];
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.replace(/#.*$/,"").trim(); if(!line) return;
    const m=line.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/); if(!m){ errors.push(`line ${i+1}: expected "key: value"`); return; }
    const name=m[1], val=m[2].trim().replace(/^["']|["']$/g,"");
    const c=CRIT_BY_NAME[name]; if(!c){ errors.push(`line ${i+1}: unknown criterion "${name}"`); return; }
    if(!val||val==="?"){ notes.push(`${name}: unknown, kept at ${STATE[c.key]}`); return; }
    if(val==="none"){ if(optsFor(c.key,STATE).length===0) return; errors.push(`line ${i+1}: ${name} applies here, "none" is not allowed (${optsFor(c.key,STATE).map(o=>o.v).join(" | ")})`); return; }
    if(/[|,\[\{]/.test(val)){ errors.push(`line ${i+1}: ${name} must be a single value here (candidates/weights not supported yet)`); return; }
    if(!CHOICES[c.key].opts.some(o=>o.v===val)){ errors.push(`line ${i+1}: "${val}" is not a value of ${name} (${CHOICES[c.key].opts.map(o=>o.v).join(" | ")})`); return; }
    out[c.key]=val;
  });
  return {out,errors,notes};
}
function renderCriteria(status){
  const d=derived(STATE);
  const dl=[`dhcp_hosting: ${d.dhcp_hosting}`,`portal_runs_in: ${d.portal_runs_in}`,`app_switch_risk: ${d.app_switch_risk}`,`final_auth: ${d.final_auth}`,`outcome: ${d.outcome}`,`steps: [${d.steps.join(", ")}]`].join("\n");
  const link=location.href.split("#")[0]+(location.hash||"");
  document.getElementById("criteria").innerHTML=`<p class="tintro">Read or edit the criteria of the current journey, then apply. Values are validated against the diagrams; a value that no longer fits the configuration is corrected automatically.</p>
    <textarea id="critta" class="yaml" rows="${CRIT.length+4}" spellcheck="false" aria-label="Criteria (YAML)">${esc(criteriaText(STATE))}</textarea>
    <div class="critbar"><button type="button" class="readbtn" id="critapply">Apply</button><button type="button" class="linkbtn" id="critreset">Reload from current journey</button><span id="critstatus" class="critstatus ${status&&status.ok===false?"err":""}">${status?esc(status.msg):""}</span></div>
    <h3 class="crith">Derived (read-only)</h3><pre class="yaml ro" aria-label="Derived values">${esc(dl)}</pre>
    <p class="tintro">Share this configuration: <code class="yaml inline">${esc(link)}</code></p>`;
}
function applyCriteria(){
  const ta=document.getElementById("critta"); if(!ta) return;
  const {out,errors,notes}=parseCriteria(ta.value);
  if(errors.length){ renderCriteria({ok:false,msg:errors.join(" · ")}); const t=document.getElementById("critta"); if(t) t.value=ta.value; return; }
  const before={...STATE}; Object.assign(STATE,out); normalize(STATE); writeHash();
  const fixed=Object.keys(out).filter(k=>STATE[k]!==out[k]).map(k=>`${CRIT.find(c=>c.key===k).name} → ${STATE[k]}`);
  const changed=Object.keys(STATE).filter(k=>STATE[k]!==before[k]).length;
  const msg=[`Applied (${changed} change${changed===1?"":"s"}).`,fixed.length?`Adjusted to fit: ${fixed.join(", ")}.`:"",...notes].filter(Boolean).join(" ");
  renderCriteria({ok:true,msg});
}
function render(anchorKey,oldTop){
  document.querySelectorAll(".viewtab").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===VIEW));
  ["comic","sequence","decision","criteria"].forEach(v=>document.getElementById(v).hidden=(v!==VIEW));
  const wbtn=document.getElementById("widebtn"); if(wbtn){ const w=VIEW==="decision"||VIEW==="sequence"; wbtn.hidden=!w; if(!w){ document.body.classList.remove("wide"); wbtn.setAttribute("aria-pressed","false"); } }
  if(VIEW==="comic") renderComic(); else if(VIEW==="sequence") renderSeq(); else if(VIEW==="decision") renderDecision(); else renderCriteria();
  if(anchorKey!=null && oldTop!=null && VIEW==="comic"){
    const el=document.querySelector(`#comic [data-choice="${anchorKey}"]`);
    if(el) window.scrollBy(0, el.getBoundingClientRect().top-oldTop);
  }
}
function choose(opt){
  const set=opt.getAttribute("data-set");
  const host=opt.closest("[data-choice]"), top=host?host.getBoundingClientRect().top:null;
  const box=document.querySelector(`#${VIEW} .seqscroll`), sl=box?box.scrollLeft:0, stp=box?box.scrollTop:0;
  const wx=window.scrollX, wy=window.scrollY;
  let key=null;
  if(set){ Object.assign(STATE,JSON.parse(set)); }
  else { key=opt.getAttribute("data-k"); STATE[key]=opt.getAttribute("data-v"); }
  normalize(STATE); writeHash(); render(key,top);
  if(VIEW!=="comic"){ const nb=document.querySelector(`#${VIEW} .seqscroll`); if(nb){ nb.scrollLeft=sl; nb.scrollTop=stp; } window.scrollTo(wx,wy); }
}
document.addEventListener("click",e=>{
  const opt=e.target.closest(".wopt"); if(opt){ choose(opt); return; }
  const wb=e.target.closest(".widebtn"); if(wb){ const on=document.body.classList.toggle("wide"); wb.setAttribute("aria-pressed",on); if(VIEW==="sequence"){ const wy=window.scrollY; render(); window.scrollTo(window.scrollX,wy); } return; }
  const tab=e.target.closest(".viewtab"); if(tab){ VIEW=tab.dataset.view; writeHash(); render(); window.scrollTo(0,0); return; }
  if(e.target.closest("#critapply")){ applyCriteria(); return; }
  if(e.target.closest("#critreset")){ renderCriteria({ok:true,msg:"Reloaded."}); return; }
});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="critta"&&(e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); applyCriteria(); return; }
  const opt=e.target.closest&&e.target.closest("g.wopt");
  if(opt && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); choose(opt); }
});
document.addEventListener("change",e=>{
  const sel=e.target.closest&&e.target.closest("select.wselect"); if(!sel) return;
  const host=sel.closest("[data-choice]"), top=host?host.getBoundingClientRect().top:null, key=sel.getAttribute("data-k");
  STATE[key]=sel.value; normalize(STATE); writeHash(); render(key,top);
  const again=document.getElementById("wi-"+key); if(again) again.focus({preventScroll:true});
});
window.addEventListener("hashchange",()=>{ readHash(); render(); });
readHash(); render();
